name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm 10's Arborist crashes resolving vitest 4's optional peers
      # ("Cannot read properties of null (reading 'edgesOut')")
      - run: npm install -g npm@11
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: node bin/cli.js "តាំង លាងខៃ"

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm 10's Arborist crashes resolving vitest 4's optional peers
      # ("Cannot read properties of null (reading 'edgesOut')")
      - run: npm install -g npm@11
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: node bin/cli.js "តាំង លាងខៃ"
      # Accuracy regression gates (no lockbox reads — famous is in-sample
      # and the scraped eval uses the committed corpus; both are
      # deterministic). Thresholds have headroom below current baselines
      # (famous 70/72, in-domain 282/835) so only real regressions trip.
      - run: node scripts/eval-famous.mjs --min-exact 70
      - run: node scripts/eval-scraped.mjs --min-exact 270
